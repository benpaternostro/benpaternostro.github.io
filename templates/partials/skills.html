<details class="profile-details" id="toolkit">
  <summary>Toolkit <span class="disclosure-icon" aria-hidden="true"></span></summary>
  <dl class="detail-body">
    {% for skill in resume.skills %}
    <dt>{{ skill.name }}</dt><dd>{{ skill.keywords | join(sep=", ") }}</dd>
    {% endfor %}
  </dl>
</details>
