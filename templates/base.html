<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}" />
    <meta name="theme-color" content="#ffffff" />
    {% block social %}{% endblock social %}
    <link
      rel="preload"
      href="{{ get_url(path='fonts/literata-var.woff2') }}"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="{{ get_url(path='styles.css', cachebust=true) }}" />
    <link rel="icon" href="{{ get_url(path='favicon.ico', cachebust=true) }}" sizes="16x16 32x32" />
    <link rel="icon" type="image/svg+xml" href="{{ get_url(path='favicon.svg', cachebust=true) }}" sizes="any" />
    <link rel="apple-touch-icon" href="{{ get_url(path='apple-touch-icon.png', cachebust=true) }}" sizes="180x180" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <main class="wrap" id="main">{% block content %}{% endblock content %}</main>
  </body>
</html>
