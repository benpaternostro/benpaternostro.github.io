<!doctype html>
<!-- Source for static/og.png, the link preview image. Screenshot at 1200 x 630. -->
<html lang="en">
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Bricolage"; src: url("../static/fonts/bricolage-grotesque-latin.woff2") format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Source Serif 4"; src: url("../static/fonts/source-serif-4-latin-wght-normal.woff2") format("woff2"); font-weight: 200 900; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between; background: #f7f3ee; color: #1f1a1d; font-family: "Bricolage", sans-serif; -webkit-font-smoothing: antialiased; }
  .top { display: flex; align-items: center; gap: 16px; font-size: 26px; font-weight: 600; letter-spacing: -.01em; }
  .mark { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 15px; background: #1f1a1d; color: #f7f3ee; font-size: 20px; }
  h1 { font-size: 104px; font-weight: 600; line-height: .98; letter-spacing: -.045em; }
  h1 em { font-style: normal; color: #803b55; }
  p { font: 30px/1.4 "Source Serif 4", Georgia, serif; color: #6b6166; }
</style>
<body>
  <div class="top"><span class="mark">BP</span>Ben Paternostro</div>
  <h1>I'm Ben, a software engineer <em>in Sydney.</em></h1>
  <p>benpaternostro.com</p>
</body>
</html>
